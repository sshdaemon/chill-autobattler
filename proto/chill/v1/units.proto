syntax = "proto3";

package chill.v1;

// Building blocks of an army, shared by battles and runs.

// Unit types: a unit's value is its sim.Class id + 1 (sim/ids.go). No values
// are named: proto3 enums are open, and the sim rejects ids its roster lacks.
// 1-3 were the retired Classic units (warrior, archer, mage).
enum UnitClass {
  reserved 1 to 3;
  reserved "UNIT_CLASS_WARRIOR", "UNIT_CLASS_ARCHER", "UNIT_CLASS_MAGE";
  UNIT_CLASS_UNSPECIFIED = 0;
}

// FORMATION_CUSTOM means every unit carries its own position.
enum Formation {
  FORMATION_UNSPECIFIED = 0; // rejected
  FORMATION_CUSTOM = 1;
  FORMATION_SPREAD = 2;
  FORMATION_3_2 = 3;
  FORMATION_2_3 = 4;
  FORMATION_4_1 = 5;
  FORMATION_1_4 = 6;
  FORMATION_0_5 = 7;
  FORMATION_5_0 = 8;
}

// A point in raw Q48.16 fixed-point metres (value × 65536), so no float
// rounding ever happens on the wire.
message Point {
  sint64 x_raw = 1;
  sint64 z_raw = 2;
}

message UnitSpec {
  UnitClass unit_class = 1;
  // Abilities by number within the unit's roster entry, 1..5 in the order it
  // lists them (sim/unit_*.go); numbers mean nothing across units.
  repeated uint32 skills = 2;
  // Required with FORMATION_CUSTOM, absent otherwise.
  Point position = 3;
}

message Army {
  Formation formation = 1;
  repeated UnitSpec units = 2;
  // Battle plan: the sim's plan id (sim/ids.go, Plan). 0 is Instinct, the
  // default: every unit fights by its own temperament.
  uint32 plan = 3;
  // A plan built from chips (sim/custom.go), used instead of plan, which
  // must then be 0. Set it, even empty, to fight by a custom plan.
  CustomPlan custom_plan = 4;
}

// One role's chips in a custom plan; 0 is "own" (the unit's value) everywhere.
// Values are the sim's ids: target and engage rules, step indexes (0..3),
// fall back and stay near indexes, kite (1 on, 2 off) and the edge id.
message PlanChips {
  uint32 target = 1;
  uint32 engage = 2;
  uint32 trigger = 3;
  uint32 keep = 4;
  uint32 leash = 5;
  uint32 fall_back = 6;
  uint32 stay_near = 7;
  uint32 kite = 8;
  uint32 edge = 9;
}

message PlanRoles {
  PlanChips melee = 1;
  PlanChips ranged = 2;
  PlanChips caster = 3;
}

// A custom tactic's group: its opening stance, its trigger (the sim's
// trigger kind; seconds for "after") and its second stance.
message PlanGroup {
  PlanRoles opening = 1;
  uint32 trigger = 2;
  uint32 trigger_seconds = 3;
  PlanRoles then = 4;
}

message CustomPlan {
  PlanRoles roles = 1;
  repeated PlanGroup groups = 2; // none, or left and right
}

