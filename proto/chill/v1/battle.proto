syntax = "proto3";

package chill.v1;

import "chill/v1/runstate.proto";
import "chill/v1/units.proto";

// The server never drives a battle. It issues one (seeds), takes the player's
// army before revealing the combat seed, and afterwards re-runs the battle to
// check the outcome the client claims. The client plays it locally (sim in WASM).
service BattleService {
  // Creates a battle: returns its id and map seed (not the combat seed).
  rpc StartBattle(StartBattleRequest) returns (StartBattleResponse);
  // Commits Blue's army (once, before the deploy deadline) and reveals the combat seed.
  rpc LockDeployment(LockDeploymentRequest) returns (LockDeploymentResponse);
  // Re-runs the stored battle and judges the claim. The first verdict is final.
  rpc VerifyBattle(VerifyBattleRequest) returns (VerifyBattleResponse);
}

// Everything that decides a battle. The client assembles it from what the
// server issued; the server rebuilds it from what it stored.
message BattleInput {
  string sim_version = 1;
  // Map seed: the map and a generated Red army. Public from StartBattle.
  uint64 seed = 2;
  Army blue = 3;
  // Empty: Red's army, formation and red_skill_count skills come from the seed.
  Army red = 4;
  uint32 red_skill_count = 5;
  // Every combat roll. Revealed by LockDeployment.
  uint64 combat_seed = 6;
  // Red's health in percent (0 = full). The server eases a run's first matches.
  uint32 red_health_pct = 7;
}

enum BattleResult {
  BATTLE_RESULT_UNSPECIFIED = 0;
  BATTLE_RESULT_BLUE_WIN = 1;
  BATTLE_RESULT_RED_WIN = 2;
  BATTLE_RESULT_DRAW = 3;
}

message Survivor {
  // Unit index: Blue's units in input order, then Red's.
  uint32 index = 1;
  sint64 hp_raw = 2;
}

message BattleOutcome {
  BattleResult result = 1;
  uint32 ticks = 2;
  repeated Survivor survivors = 3;
  uint64 checksum = 4;
}

message StartBattleRequest {
  string sim_version = 1;
  reserved 2; // was red_skill_count: now computed from the run's veterans
  reserved "red_skill_count";
  // The run this battle is the next match of.
  string run_id = 3;
}

message StartBattleResponse {
  string battle_id = 1;
  uint64 seed = 2; // map seed
  // Total skills of the run's veterans; Red gets as many.
  uint32 red_skill_count = 3;
  // Unix milliseconds.
  int64 deploy_deadline_ms = 4;
  // Red's health in percent for this battle (0 = full).
  uint32 red_health_pct = 5;
}

message LockDeploymentRequest {
  string battle_id = 1;
  Army blue = 2;
}

message LockDeploymentResponse {
  uint64 combat_seed = 1;
  // Unix milliseconds.
  int64 verify_deadline_ms = 2;
}

message VerifyBattleRequest {
  string battle_id = 1;
  // What the client says happened.
  BattleOutcome claimed = 2;
}

message VerifyBattleResponse {
  bool fair = 1;
  string reason = 2;
  // The server's own outcome (absent if the input was rejected).
  BattleOutcome outcome = 3;
  // The run after this result (score, veterans, picks owed, or over).
  Run run = 4;
}
