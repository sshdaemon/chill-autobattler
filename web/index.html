<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chill Autobattler</title>
    <style>
      html, body, #root { margin: 0; height: 100%; background: #8fb6d8; font: 14px system-ui, sans-serif; color: #1d2330; overflow: hidden; }
      button { cursor: pointer; font: inherit; }
      button:disabled { cursor: default; opacity: .5; }
      .dim { color: #667; }
      .b { color: #2a6fd0; font-weight: 600; } .r { color: #d83a3a; font-weight: 600; }
      .err { color: #c00; margin-top: 8px; }
      .overlay { position: fixed; inset: 0; display: grid; place-items: center; background: #0b142080; z-index: 10; }
      .overlay.clear { background: #0b142040; }
      .panel { background: #fbfcfe; border-radius: 12px; padding: 20px 24px; box-shadow: 0 8px 40px #0004; max-width: min(860px, calc(100vw - 32px)); max-height: calc(100vh - 32px); overflow: auto; text-align: center; }
      .panel h2 { margin: 0 0 4px; } .panel .sub { color: #667; margin-bottom: 14px; }
      .cards { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
      .card { flex: 1 1 160px; min-width: 160px; max-width: 220px; border: 1px solid #dde3ee; border-radius: 10px; padding: 12px; text-align: left; }
      .card .icon { font-size: 30px; } .card .name { font-weight: 700; font-size: 16px; } .card .blurb { color: #667; font-size: 12px; min-height: 30px; }
      .card table { width: 100%; font-size: 12px; margin: 6px 0; border-collapse: collapse; } .card td:last-child { text-align: right; font-variant-numeric: tabular-nums; }
      .card.faction { max-width: 250px; border-top: 4px solid; display: flex; flex-direction: column; gap: 6px; }
      .card.faction .lore { font-size: 12px; color: #445; margin: 0; }
      .card.faction .units { font-size: 12px; margin: 0; padding-left: 16px; flex: 1; }
      .card.faction .go { margin-top: 6px; } .card.faction.coming { opacity: .75; }
      .panel.draft .turn { margin: 4px 0 10px; font-weight: 600; color: #556; } .panel.draft .turn.yours { color: #2a6fd0; }
      .panel.draft .sides { display: flex; gap: 16px; justify-content: center; flex-wrap: wrap; margin-bottom: 10px; }
      .panel.draft .side .label { font-size: 13px; font-weight: 600; } .panel.draft .side.b .label { color: #2a6fd0; } .panel.draft .side.r .label { color: #d83a3a; }
      .panel.draft .side .slots { margin: 6px 0; } .panel.draft .slots span i { font-size: 9px; color: #c8941a; font-style: normal; }
      .panel.draft .card .stats { font-size: 12px; color: #445; margin: 4px 0; }
      .panel.draft .card .abilities { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
      .panel.draft .card .abilities button { font-size: 12px; padding: 4px 8px; border-radius: 6px; border: 1px solid #c5cedd; background: #fff; }
      .panel.draft .card .abilities button:not(:disabled):hover { background: #e8f0ff; border-color: #3a8cff; }
      .panel.draft .card.waiting { opacity: .7; }
      .card .takes { font-size: 11px; color: #556; background: #f2f5fa; border-radius: 6px; padding: 4px 6px; }
      .card .count { display: flex; align-items: center; justify-content: center; gap: 14px; margin-top: 8px; }
      .card .count button { width: 32px; height: 32px; border-radius: 50%; border: 1px solid #c5cedd; background: #fff; font-size: 18px; }
      .card .count b { font-size: 20px; min-width: 20px; text-align: center; }
      .slots { display: flex; gap: 6px; justify-content: center; margin: 14px 0; }
      .slots span { width: 36px; height: 36px; border-radius: 8px; border: 1px solid #c5cedd; display: grid; place-items: center; font-size: 20px; background: #fff; }
      .slots span.empty { border-style: dashed; background: transparent; }
      .go { background: #3a8cff; color: #fff; border: 0; border-radius: 8px; padding: 10px 18px; font-weight: 600; }
      .deploybar { position: fixed; left: 50%; bottom: 12px; transform: translateX(-50%); display: flex; gap: 12px; align-items: stretch; background: #0b1420b8; padding: 10px; border-radius: 12px; color: #fff; z-index: 5; max-width: calc(100vw - 32px); overflow-x: auto; }
      .deploymain { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
      .plans { display: flex; gap: 4px; align-items: center; flex-wrap: wrap; }
      .plans .lbl { font-size: 11px; opacity: .7; margin-right: 2px; }
      .pbtn { background: #ffffff14; border: 1px solid #ffffff30; color: #fff; border-radius: 6px; padding: 3px 8px; font-size: 12px; }
      .pbtn.on { border-color: #ffd23f; background: #ffd23f22; } .pbtn:disabled.on { opacity: 1; }
      .plandesc { font-size: 11px; opacity: .75; min-height: 14px; }
      .pbtn.edit { border-style: dashed; }
      .planeditor { position: fixed; left: 50%; top: 52px; transform: translateX(-50%); width: min(920px, calc(100vw - 32px)); max-height: calc(100vh - 260px); overflow-y: auto; background: #0b1420f0; color: #fff; border: 1px solid #ffffff30; border-radius: 12px; padding: 12px; z-index: 19; display: flex; flex-direction: column; gap: 8px; font-size: 12px; }
      .pehead { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; } .pehead .from { opacity: .7; } .pehead .split { margin-left: auto; }
      .petabs { display: flex; gap: 4px; flex-wrap: wrap; }
      .peroles { display: grid; grid-template-columns: repeat(auto-fit, minmax(270px, 1fr)); gap: 10px; }
      .role { background: #ffffff0a; border-radius: 8px; padding: 8px; display: flex; flex-direction: column; gap: 4px; }
      .rolehead span { opacity: .75; font-size: 11px; }
      .chiprow { display: flex; gap: 3px; flex-wrap: wrap; align-items: center; }
      .chiprow .lbl { width: 64px; font-size: 11px; opacity: .7; flex: none; }
      .chip { background: #ffffff10; border: 1px solid #ffffff28; color: #fff; border-radius: 10px; padding: 1px 7px; font-size: 11px; }
      .chip.on { border-color: #ffd23f; background: #ffd23f26; }
      .pefoot { display: flex; gap: 8px; align-items: center; justify-content: flex-end; }
      .peerror { margin-right: auto; opacity: .8; } .peerror.bad { color: #ff9c8a; opacity: 1; }
      .banner small.plan { display: block; font-size: .45em; margin-top: 4px; color: #ff8a8a; }
      .formations { display: flex; gap: 6px; }
      .fbtn { display: flex; flex-direction: column; align-items: center; gap: 2px; background: #ffffff14; border: 1px solid #ffffff30; color: #fff; border-radius: 8px; padding: 4px; font-size: 11px; }
      .fbtn svg { width: 72px; height: 42px; } .fbtn.on { border-color: #ffd23f; background: #ffd23f22; } .fbtn:disabled.on { opacity: 1; }
      .deployside { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-width: 120px; }
      .deployside .timer b { font-size: 22px; } .deployside .bar { width: 100%; height: 4px; background: #ffffff30; border-radius: 2px; }
      .deployside .bar i { display: block; height: 100%; background: #ffd23f; border-radius: 2px; transition: width .25s linear; }
      .deployside .hint { font-size: 11px; opacity: .7; }
      .status { position: fixed; top: 48px; left: 50%; transform: translateX(-50%); background: #fffe; padding: 6px 14px; border-radius: 20px; box-shadow: 0 2px 10px #0002; z-index: 4; }
      .banner { position: fixed; top: 35%; left: 0; right: 0; text-align: center; font: 900 64px system-ui; color: #fff; text-shadow: 0 4px 16px #000a; pointer-events: none; z-index: 6; }
      .banner.small { font-size: 28px; }
      .result h1 { margin: 0; font-size: 44px; } .result.victory h1 { color: #2a6fd0; } .result.defeat h1 { color: #d83a3a; }
      .result .surv { margin: 12px 0; font-size: 20px; display: grid; gap: 4px; }
      .verdict { margin: 10px 0 14px; font-size: 13px; } .verdict.unfair, .verdict.error { color: #c00; } .verdict button { margin-left: 8px; }
      .dev { position: fixed; top: 12px; right: 12px; display: flex; gap: 6px; align-items: center; background: #fffd; padding: 6px 8px; border-radius: 8px; font-size: 12px; z-index: 20; }
      .dev button { border: 1px solid #c5cedd; background: #fff; border-radius: 4px; } .dev button.on { background: #3a8cff; color: #fff; border-color: #2a6fd0; }
      .dev input { width: 40px; }
      .slots span.vet { border-color: #e0b84a; background: #fff6dc; position: relative; }
      .slots span.vet i, .picks i { font-style: normal; color: #c99a1e; font-size: 10px; }
      .slots span.vet i { position: absolute; bottom: -2px; }
      .runbar .surrender { margin-left: 10px; font-size: 12px; padding: 2px 8px; border-radius: 6px; border: 1px solid #e3b4b4; background: #fff5f5; color: #a33; }
      .runbar { position: fixed; top: 12px; left: 12px; background: #fffe; padding: 6px 12px; border-radius: 8px; box-shadow: 0 2px 10px #0002; z-index: 20; font-size: 13px; }
      .picks { margin: 12px 0; text-align: left; } .picks h3 { text-align: center; margin: 4px 0 8px; }
      .pickrow { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin: 6px 0; }
      .pickrow .who { min-width: 130px; font-weight: 600; }
      .pickrow button { border: 1px solid #c5cedd; background: #fff; border-radius: 6px; padding: 4px 8px; font-size: 12px; }
      .pickrow button.on { background: #ffd23f; border-color: #c99a1e; }
      .picks .go { display: block; margin: 10px auto 0; }
      .runover { margin: 8px 0; }
      table.board { margin: 8px auto 14px; border-collapse: collapse; min-width: 320px; font-size: 13px; }
      table.board th, table.board td { padding: 3px 8px; text-align: left; } table.board td:last-child, table.board th:last-child { text-align: right; }
      table.board tr.mine { background: #fff1c2; font-weight: 600; }
      .result.run-over h1 { color: #d83a3a; }
      .grouptag { font: 700 11px system-ui; color: #fff; background: #2b5fb8cc; border: 1px solid #fff8; border-radius: 3px; padding: 0 4px; }
      .stars { color: #ffd23f; font: 700 13px system-ui; text-shadow: 0 0 3px #000, 0 0 3px #000; letter-spacing: -1px; white-space: nowrap; }
      .portraits { position: fixed; bottom: 10px; display: flex; gap: 4px; z-index: 6; }
      .portraits.blue { left: 10px; } .portraits.red { right: 10px; flex-direction: row-reverse; }
      .pcard { position: relative; width: 62px; background: #0b1420cc; border: 2px solid #3a8cff; border-radius: 8px; padding: 3px; color: #fff; cursor: pointer; text-align: center; }
      .pcard.t1 { border-color: #ff4040; } .pcard.sel { box-shadow: 0 0 0 2px #ffd23f; }
      .pcard img, .pcard .ph { width: 56px; height: 56px; border-radius: 5px; display: grid; place-items: center; font-size: 28px; background: #233; object-fit: cover; }
      .pcard.dead img, .pcard.dead .ph { filter: grayscale(1) brightness(.5); }
      .pcard .cross { position: absolute; top: 18px; left: 0; right: 0; font-size: 26px; color: #ddd; text-shadow: 0 0 4px #000; }
      .pcard .vet { position: absolute; top: -9px; left: 0; right: 0; color: #ffd23f; font-size: 11px; text-shadow: 0 0 3px #000; letter-spacing: -1px; }
      .pcard .bar { height: 5px; background: #222; border-radius: 3px; margin-top: 3px; overflow: hidden; } .pcard .bar i { display: block; height: 100%; background: #3a8cff; }
      .pcard.t1 .bar i { background: #ff4040; } .pcard .num { font-size: 11px; font-variant-numeric: tabular-nums; }
      .info { position: fixed; left: 10px; bottom: 112px; width: 280px; background: #fffe; border-radius: 10px; padding: 10px 12px; box-shadow: 0 4px 16px #0003; z-index: 6; font-size: 12px; }
      .info .x { position: absolute; top: 4px; right: 6px; border: 0; background: none; font-size: 18px; }
      .info .title { font-size: 15px; font-weight: 700; } .info .vetstars { color: #c99a1e; }
      .info .hp { position: relative; height: 14px; background: #ddd; border-radius: 7px; margin: 6px 0; overflow: hidden; }
      .info .hp i { display: block; height: 100%; background: #4caf50; } .info .hp span { position: absolute; inset: 0; text-align: center; font-size: 10px; line-height: 14px; }
      .info .st { font-weight: 600; margin-bottom: 4px; } .info table { width: 100%; border-collapse: collapse; } .info td:nth-child(2n) { text-align: right; padding-right: 8px; font-variant-numeric: tabular-nums; }
      .info .takes, .info .skills { margin-top: 4px; } .info .keys { margin-top: 6px; font-size: 10px; }
      .minimap { position: fixed; right: 10px; top: 52px; width: 160px; height: 160px; border-radius: 8px; box-shadow: 0 2px 10px #0004; cursor: crosshair; z-index: 6; image-rendering: auto; }
      .float { font: bold 16px system-ui; text-shadow: 0 0 3px #000, 0 0 3px #000; white-space: nowrap; animation: rise 1s linear forwards; }
      @keyframes rise { from { transform: translateY(0); opacity: 1 } to { transform: translateY(-28px); opacity: 0 } }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
