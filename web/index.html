<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chill Autobattler</title>
    <style>
      html, body, #root { margin: 0; height: 100%; background: #8fb6d8; font: 14px system-ui, sans-serif; }
      .hud { position: fixed; top: 12px; left: 12px; background: #fffe; padding: 10px 12px; border-radius: 8px; max-width: 380px; box-shadow: 0 2px 10px #0002; }
      .hud .row { display: flex; gap: 6px; align-items: center; margin-top: 8px; flex-wrap: wrap; }
      .hud .dim { color: #667; font-size: 12px; }
      .hud button { cursor: pointer; }
      .hud button.on, .hud button.primary { background: #3a8cff; color: #fff; border: 1px solid #2a6fd0; border-radius: 4px; }
      .hud .err { color: #c00; margin-top: 6px; }
      .float { font: bold 16px system-ui; text-shadow: 0 0 3px #000, 0 0 3px #000; white-space: nowrap; animation: rise 1s linear forwards; }
      @keyframes rise { from { transform: translateY(0); opacity: 1 } to { transform: translateY(-28px); opacity: 0 } }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
